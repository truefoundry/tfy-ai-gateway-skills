name: Skill checks

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/check_skills.py"
      - "scripts/tool_schemas.py"
      - "tool-schemas/**"
      - ".github/workflows/skill-checks.yml"

permissions:
  contents: read

jobs:
  check:
    name: Size cap and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install httpx

      - name: Check
        run: python scripts/check_skills.py
