name: Check Agent Skills

on:
  pull_request:

jobs:
  check:
    name: Check skill bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check skill bundle
        run: python .github/scripts/check_skills.py
