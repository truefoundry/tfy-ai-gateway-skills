name: Ask TFY eval (nightly baseline)

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ask-tfy-eval-nightly
  cancel-in-progress: false

jobs:
  baseline:
    name: Run every case on platform
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: evals
    env:
      ASK_TFY_HOST: ${{ secrets.EVAL_ASK_TFY_HOST }}
      ASK_TFY_TENANT: ${{ secrets.EVAL_ASK_TFY_TENANT }}
      TFY_API_KEY: ${{ secrets.EVAL_TFY_API_KEY }}
      TRUEFORGE_BASE_URL: ${{ secrets.EVAL_TRUEFORGE_BASE_URL }}
      TRUEFORGE_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'tfy-ai-anthropic/claude-sonnet-5-5' }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
      EVAL_FIXTURE_MANAGER: ${{ secrets.EVAL_FIXTURE_MANAGER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv pip install --system -r requirements.txt

      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ vars.TS_CI_APPLY_CLIENT_ID }}
          audience: ${{ vars.TS_CI_APPLY_AUDIENCE }}
          tags: tag:ci-internal
          hostname: gh-${{ github.event.repository.name }}-${{ github.run_id }}

      - name: Seed fixtures
        run: python -m runner.seed_fixtures

      - name: Run
        run: python -m runner run --kind nightly --skills-ref origin/platform --run runner/runs/nightly

      # The repo is public: run directories hold devtest data, so only headline numbers are shown
      # and the artifact is encrypted. Redacted traces are in LangSmith.
      - name: Headline
        if: always()
        run: |
          [ -f runner/runs/nightly/report.md ] || exit 0
          sed -n '/^## Headline/,/^## Verdict/p' runner/runs/nightly/report.md | sed '$d' >> "$GITHUB_STEP_SUMMARY"

      # Kept on failure too, for debugging; the PR gate only takes baselines from successful runs.
      - name: Encrypt the run
        if: always()
        env:
          EVAL_ARTIFACT_KEY: ${{ secrets.EVAL_ARTIFACT_KEY }}
        run: |
          [ -d runner/runs/nightly ] || exit 0
          tar -czf - -C runner/runs nightly \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:EVAL_ARTIFACT_KEY -out baseline.tar.gz.enc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ask-tfy-baseline
          path: evals/baseline.tar.gz.enc
          retention-days: 14
          if-no-files-found: ignore

      # Last, so a regression fails the job only after the run is saved. Cases changed or removed
      # since the previous night were reviewed in their PR, so they are accepted here; a runner or
      # judge change makes the nights incomparable, which is a warning, not a regression.
      - name: Compare with the previous night
        if: always() && hashFiles('evals/runner/runs/nightly/summary.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVAL_ARTIFACT_KEY: ${{ secrets.EVAL_ARTIFACT_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.EVAL_SLACK_WEBHOOK_URL }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow eval-nightly.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$prev" ]; then echo "No earlier successful nightly to compare with." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p previous
          # A run from before a key rotation cannot be opened; tonight's run becomes the next baseline.
          if ! { gh run download "$prev" --repo "$GITHUB_REPOSITORY" --name ask-tfy-baseline --dir previous \
              && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:EVAL_ARTIFACT_KEY -in previous/baseline.tar.gz.enc \
              | tar -xzf - -C previous; }; then
            echo "::warning::Could not open the previous nightly (run $prev); not compared"
            echo "Could not open the previous nightly (run $prev); not compared." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          accept=$(jq -rs '[.[] | (.all_case_hashes // .case_hashes) | keys[]] | unique | join(",")' \
            previous/nightly/config.json runner/runs/nightly/config.json)
          status=0
          python -m runner gate --baseline previous/nightly --candidate runner/runs/nightly --accept "$accept" \
            > nightly-gate.md 2>&1 || status=$?
          sed "s|^## Ask TFY eval gate|## Compared with the previous night (run $prev)|" nightly-gate.md >> "$GITHUB_STEP_SUMMARY"
          verdict=fail
          if [ "$status" = 0 ]; then verdict=pass; elif grep -q "Not comparable" nightly-gate.md; then verdict=incomparable; fi
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            headline=$(sed -n '/^## Headline/,/^## Verdict/p' runner/runs/nightly/report.md | grep -E 'Runs fully correct|Mean score|Cost' | sed 's/\*\*//g')
            text=$(printf 'Ask TFY nightly: %s vs the previous night\n%s\n%s' "$verdict" "$headline" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            jq -n --arg text "$text" '{text: $text}' | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" \
              || echo "::warning::Slack post failed"
          fi
          case "$verdict" in
            pass) ;;
            incomparable) echo "::warning::Runner, judge or model changed since the previous night; not compared" ;;
            *) echo "::error::Gate failed against the previous night (regression, or too many unmeasured trials); see the job summary"; exit 1 ;;
          esac
