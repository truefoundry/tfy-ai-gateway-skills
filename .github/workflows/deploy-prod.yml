name: Upload Agent Skills to Prod environment

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - manifest.yaml
      - .github/workflows/deploy-prod.yml

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Upload (Prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install TrueFoundry CLI
        env:
          UV_SYSTEM_PYTHON: 1
        run: uv pip install --pre truefoundry

      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ vars.TS_CI_APPLY_CLIENT_ID }}
          audience: ${{ vars.TS_CI_APPLY_AUDIENCE }}
          tags: tag:ci-internal
          hostname: gh-${{ github.event.repository.name }}-${{ github.run_id }}

      - name: Apply manifest
        env:
          TFY_HOST: ${{ secrets.TFY_HOST_PROD }}
          TFY_API_KEY: ${{ secrets.TFY_API_KEY_PROD }}
        run: tfy apply -f manifest.yaml
